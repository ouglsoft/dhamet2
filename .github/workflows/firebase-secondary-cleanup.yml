name: Dhamet2 Firebase Secondary Cleanup

on:
  schedule:
    - cron: "17 0-1,3-23 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and report without deleting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dhamet2-firebase-secondary-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || 'https://dhamet2-default-rtdb.firebaseio.com' }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_CLEANUP_TOKEN: ${{ secrets.FIREBASE_CLEANUP_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean stale Firebase data
        run: node scripts/firebase-secondary-cleanup.mjs

  cleanup-actions-history:
    name: Keep latest Actions run per workflow
    if: github.event_name == 'schedule' && github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete older completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100,
            });
            let deleted = 0;
            const failures = [];

            for (const workflow of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.id,
                per_page: 100,
              });
              runs.sort((a, b) => {
                const time = Date.parse(b.created_at || '') - Date.parse(a.created_at || '');
                return time || String(b.id).localeCompare(String(a.id));
              });
              const olderCompleted = runs.slice(1).filter((run) => run.status === 'completed');

              for (let offset = 0; offset < olderCompleted.length; offset += 10) {
                const batch = olderCompleted.slice(offset, offset + 10);
                await Promise.all(batch.map(async (run) => {
                  try {
                    await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                    deleted += 1;
                  } catch (error) {
                    failures.push(`${workflow.name} #${run.run_number}: ${error.message}`);
                  }
                }));
              }
            }

            core.info(`Deleted ${deleted} older completed workflow runs.`);
            if (failures.length) {
              failures.forEach((failure) => core.warning(failure));
              core.setFailed(`Failed to delete ${failures.length} workflow runs.`);
            }
