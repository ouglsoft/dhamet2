<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="light dark" name="color-scheme"/>
<meta content="noindex,nofollow" name="robots"/>
<link href="https://dhamet2.ouglsoft.com/pages/loby.html" rel="canonical"/>
<title data-i18n="lobby.title">الغرف النشطة واللاعبون المتصلون</title>
<meta content="20260725-uiparity1" name="dhamet2-build"/>
<link href="../assets/icons/icon.webp" rel="icon" type="image/webp"/>
<script src="../js/theme-colors.js?v=20260725-uiparity1"></script>
<link href="../css/style.css?v=20260725-uiparity1" rel="stylesheet"/>
<link href="../css/pages.css?v=20260725-uiparity1" rel="stylesheet"/>
<link href="../css/mobile.css?v=20260725-uiparity1" rel="stylesheet"/>
<link href="../css/theme.css?v=20260725-uiparity1" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<script src="../js/firebase.config.js?v=20260725-uiparity1"></script>
<script src="../js/emergency-shell.js?v=20260725-uiparity1"></script>
<script src="../js/i18n.js?v=20260725-uiparity1"></script>
<script src="../js/modal.js?v=20260725-uiparity1"></script>
<script src="../js/visual-shell.js?v=20260725-uiparity1"></script>
<script src="../js/online.passive.js?v=20260725-uiparity1"></script>
<script src="../js/online.js?v=20260725-uiparity1"></script>
</head>
<body data-build-version="20260725-uiparity1">
<main class="z-page z-lobby-page z-vcenter">
<div class="z-page-inner z-lobby-inner">
<div class="z-lobby-head">
<div aria-hidden="true" class="z-lobby-head-left"></div>
<div class="z-lobby-head-center">
<h1 class="z-page-title" data-i18n="lobby.title">الغرف النشطة واللاعبون المتصلون</h1>
<p class="z-lobby-subtitle" data-i18n="lobby.subtitle">شاهد المباريات الجارية أو اختر لاعبًا متصلًا وادعه إلى مباراة مباشرة.</p>
</div>
<div aria-hidden="true" class="z-lobby-head-right"></div>
</div>
<div class="z-lobby-cols">
<section class="z-lobby-panel" data-i18n-aria-label="lobby.roomsTitle">
<h2 class="z-lobby-h2" data-i18n="lobby.roomsTitle">قائمة الغرف النشطة</h2>
<div class="z-lobby-list rooms" id="roomsList">
<div class="z-empty z-loading" data-i18n="lobby.loadingRooms">جاري تحميل قائمة الغرف النشطة...</div>
</div>
</section>
<section class="z-lobby-panel" data-i18n-aria-label="lobby.playersTitle">
<h2 class="z-lobby-h2" data-i18n="lobby.playersTitle">قائمة اللاعبين المتصلين</h2>
<div class="z-lobby-list players" id="playersList">
<div class="z-empty z-loading" data-i18n="lobby.loadingPlayers">جاري تحميل قائمة اللاعبين المتصلين.....</div>
</div>
</section>
</div>
<div class="z-lobby-bottom">
<button class="btn secondary z-dash-leaderboard-btn" data-i18n="dashboard.showLeaderboard" data-open-leaderboard="1" id="btnShowLeaderboardLobby" type="button">عرض الترتيب العام</button>
<div class="z-lobby-invite-controls" id="lobbyInviteControls">
<div class="z-invite-receive-row" data-online-invite-toggle="1" id="inviteReceiveToggleRow">
<span class="z-invite-receive-label" data-i18n="online.invites.receiveLabel">استقبال الدعوات:</span>
<button aria-pressed="true" class="z-invite-receive-toggle" id="btnInviteReceiveToggle" type="button">
<span data-i18n="online.invites.enabled" data-invite-toggle-state="">مفعل</span>
</button>
</div>
<button aria-label="تحديث اللوبي" class="z-lobby-refresh-btn" data-i18n-aria-label="lobby.refresh" data-i18n-title="lobby.refresh" id="btnLobbyManualRefresh" title="تحديث اللوبي" type="button">
<img alt="" aria-hidden="true" class="btn-ico" src="../assets/icons/refresh.svg?v=20260725-uiparity1"/>
<span class="z-lobby-refresh-text" data-i18n="buttons.sync">تحديث</span>
</button>
</div>
<a class="btn small primary z-lobby-back" href="https://ouglsoft.com/dhamet/pages/mode.html">
<img alt="" aria-hidden="true" class="btn-ico" src="../assets/icons/chevron-left.svg?v=20260725-uiparity1"/>
<span data-i18n="lobby.backToMode">العودة إلى اختيار نمط اللعب</span>
</a>
</div>
</div>
</main>
<div id="zModalRoot" style="display:none"></div>
<script src="../js/mobile.js?v=20260725-uiparity1"></script>
</body>
</html>
